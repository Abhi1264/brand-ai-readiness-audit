[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-ai-readiness"
version = "1.0.0"
description = "Agent Skill Marketplace that audits websites for AI discoverability and on-site engagement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Brand AI-Readiness Audit" }]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.9.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
render = ["playwright>=1.45.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
web = ["uvicorn[standard]>=0.32.0"]

[project.scripts]
brand-audit = "brand_ai_readiness.orchestration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brand_ai_readiness = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: optional live-network tests against public websites",
    "playwright: tests that require a Playwright browser",
]

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.basedpyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
